[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matribox-effects-lab"
version = "0.1.0"
description = "Offline firmware and USB capture research for SONICAKE Matribox II Pro"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
reverse = ["capstone==5.0.9", "unicorn==2.1.4"]

[project.scripts]
matribox-lab = "matribox_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
